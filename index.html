<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Outfit</title>
<meta name="description" content="Dein Kleiderschrank, täglich neu kombiniert">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outfit">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d0c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <h1 id="title">Heute</h1>
  <div id="topaktion"></div>
</header>
<main id="main"></main>
<nav id="tabbar">
  <button data-tab="today" onclick="App.setTab('today')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Heute</span></button>
  <button data-tab="closet" onclick="App.setTab('closet')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.6V7a2.5 2.5 0 1 1 2.5-2.5"/><path d="M12 8.6 3.9 14.9a1.3 1.3 0 0 0 .8 2.3h14.6a1.3 1.3 0 0 0 .8-2.3L12 8.6Z"/></svg><span>Schrank</span></button>
  <button data-tab="outfits" onclick="App.setTab('outfits')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 21 12 17l-6 4V5.5A2.5 2.5 0 0 1 8.5 3h7A2.5 2.5 0 0 1 18 5.5V21Z"/></svg><span>Outfits</span></button>
  <button data-tab="trends" onclick="App.setTab('trends')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M8.6 2h6.8l-1 5.6 2.8 3.3V13H6.8v-2.1l2.8-3.3L8.6 2Z"/></svg><span>Trends</span></button>
  <button data-tab="data" onclick="App.setTab('data')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4.5" rx="1.2"/><path d="M5.2 8.5V18a2 2 0 0 0 2 2h9.6a2 2 0 0 0 2-2V8.5"/><path d="M10 12.3h4"/></svg><span>Daten</span></button>
</nav>
<div id="modal-root"></div>
<input type="file" id="pick-item" accept="image/*" hidden onchange="App.itemFileChosen(this)">
<input type="file" id="pick-trend" accept="image/*" hidden onchange="App.trendFileChosen(this)">
<input type="file" id="pick-import" accept=".json,application/json" hidden onchange="App.importChosen(this)">
<noscript>Diese App benötigt JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
