name = "outfit-ki"
main = "worker.js"
compatibility_date = "2026-01-01"

# Tageskontingent. Hochsetzen, solange du den eigenen Schrank nachanalysierst.
[vars]
TAGESLIMIT = "10"
# Modell nur setzen, wenn es vom Standard im Code abweichen soll – gemini-2.5-flash ist für neue Konten gesperrt.
# GEMINI_MODEL = "gemini-flash-lite-latest"
# Nach dem Umzug auf die eigene Adresse setzen, sonst kann jeder dein Kontingent verbrauchen:
# ALLOW_ORIGIN = "https://outfit.deine-domain.de"

# Zähler für das Tageslimit. id nach "wrangler kv namespace create ZAEHLER" eintragen.
[[kv_namespaces]]
binding = "ZAEHLER"
id = "HIER_DIE_ID_EINTRAGEN"
